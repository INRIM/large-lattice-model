[project]
name = "large-lattice-model"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.7",
    "numba>=0.62.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "ipython>=8.37.0",
    "ruff>=0.14.6",
]
doc = [
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.6.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3.0.2",
]
test = [
    "hypothesis>=6.148.1",
    "pytest>=9.0.1",
]


[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 120